name: aParticles
main: aParticles\aParticles
version: 2.0.0
api: 5.0.0
authors: ["NhanAZ"]
commands:
  particles:
    description: Buy and enable particle effects
    aliases: [hieuung]
    permission: aprt.use
permissions:
  aprt.use:
    default: true
    description: Allows using particle effect commands
  aprt.save:
    default: op
    description: Allows saving particle effect data
  aprt.flame:
    default: true
    description: Allows using the flame particle
  aprt.lava:
    default: true
    description: Allows using the lava particle
  aprt.heart:
    default: true
    description: Allows using the heart particle
  aprt.water:
    default: true
    description: Allows using the water particle
  aprt.happy:
    default: true
    description: Allows using the happy villager particle
  aprt.angry:
    default: true
    description: Allows using the angry villager particle
  aprt.bubble:
    default: true
    description: Allows using the bubble particle
  aprt.portal:
    default: true
    description: Allows using the portal particle
  aprt.enchant:
    default: true
    description: Allows using the enchant particle
